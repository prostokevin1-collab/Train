name: TTC fare monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-fare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Stop the schedule after the monitored dates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(date -u +%s)" -ge "$(date -u -d '2026-08-09 21:00:00' +%s)" ]]; then
            gh workflow disable ttc-monitor.yml --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

      - name: Run TTC price monitor
        env:
          TTC_TRIGGER_SECRET: ${{ secrets.TTC_TRIGGER_SECRET }}
          TTC_SITES_AUTH_TOKEN: ${{ secrets.TTC_SITES_AUTH_TOKEN }}
        run: |
          response="$(curl --silent --show-error --fail-with-body --retry 2 --max-time 180 \
            --request POST \
            --header "Authorization: Bearer ${TTC_TRIGGER_SECRET}" \
            --header "OAI-Sites-Authorization: Bearer ${TTC_SITES_AUTH_TOKEN}" \
            https://train-ticket-checker-rzd.chat-renata.chatgpt.site/api/internal/run-price-monitor)"
          echo "$response"
          status="$(jq -r '.status // empty' <<<"$response")"
          case "$status" in
            checked|alerted|waiting_for_chat) ;;
            *) echo "Unexpected TTC status: $status" >&2; exit 1 ;;
          esac
